#set -g utf8
#set-window-option -g utf8 on

setw -g window-status-current-style 'fg=white bg=black'


set -g status-bg colour57
set -g status-fg white

set -g status on


#set -g default-terminal "screen-256color"
set -g default-terminal "xterm-256color"

# set emacs keys
setw -g mode-keys emacs

# last window with same key, like screen
bind-key C-b last-window

# Ctrl+b b passes through Ctrl+b
bind-key b  send-prefix

# Reload config
bind-key r source-file ~/.tmux.conf

# split and hide window
#bind-key C-n swap-pane -s :+.top \; rotate-window -Ut :+
#bind-key C-p swap-pane -s :+.bottom \; rotate-window -Dt :+

# pane movement
bind-key j command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:"  "join-pane -t '%%'"

set -g history-limit 10000

# Status bar
#set-option -g status on                # turn the status bar on
#set -g status-utf8 on                  # set utf-8 for the status bar
#set -g status-interval 5               # set update frequencey (default 15 seconds)

# visual notification of activity in other windows
#setw -g monitor-activity on
#set -g visual-activity on

# enable terminal scrollbar - specify no alternate screen
set -ga terminal-overrides ',xterm*:smcup@:rmcup@'

# disable mouse control by default - change 'off' to 'on' to enable by default.
#setw -g mode-mouse off
#set-option -g mouse-resize-pane off
#set-option -g mouse-select-pane off
#set-option -g mouse-select-window off

# Start tab numbering at 1
set -g base-index 1

# aggressive resize
#setw -g aggressive-resize on
set -g window-size latest

